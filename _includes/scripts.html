<button id="theme-toggle" type="button" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode">
  <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
</button>

<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) {
      return;
    }
    function sync() {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    }
    sync();
    btn.addEventListener('click', function () {
      var root = document.documentElement;
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try {
        localStorage.setItem('theme', next);
      } catch (e) {}
      sync();
    });
  })();
</script>

<script>
  /* Live GitHub stars (total across all public repos) and Google Scholar citations */
  (function () {
    var stars = document.getElementById('github-stars');
    if (stars) {
      fetch('https://api.github.com/users/pranavphoenix/repos?per_page=100&type=public')
        .then(function (r) {
          return r.json();
        })
        .then(function (repos) {
          if (!repos || !Array.isArray(repos)) {
            return;
          }
          var total = 0;
          repos.forEach(function (repo) {
            total += (repo.stargazers_count || 0);
          });
          stars.textContent = total.toLocaleString();
        })
        .catch(function () {});
    }
    var cites = document.getElementById('scholar-citations');
    if (cites) {
      var badge = 'https://img.shields.io/endpoint?url=' + encodeURIComponent('https://google-scholar-badge.vercel.app/citations?user=3GlJQ24AAAAJ');
      fetch(badge)
        .then(function (r) {
          return r.text();
        })
        .then(function (svg) {
          var m = svg.match(/aria-label="[^"]*?([0-9,]+)/);
          if (m) {
            cites.textContent = m[1];
          }
        })
        .catch(function () {});
    }
  })();
</script>

<script>
  /* Hover-to-play for YouTube embeds (talks etc.) */
  (function () {
    var canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    var placeholder = function (id, title) {
      return '<div class="video-placeholder"><img src="https://img.youtube.com/vi/' + id + '/hqdefault.jpg" alt="' + title + '" loading="lazy" /><div class="video-play-btn" aria-hidden="true"></div></div>';
    };
    var player = function (id, title) {
      return '<iframe width="560" height="315" src="https://www.youtube.com/embed/' + id + '?autoplay=1&mute=1" title="' + title + '" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
    };
    var frames = document.querySelectorAll('iframe[src*="youtube.com/embed"]');
    frames.forEach(function (frame) {
      var m = frame.getAttribute('src').match(/embed\/([^?&]+)/);
      if (!m) {
        return;
      }
      var id = m[1];
      var title = frame.getAttribute('title') || 'YouTube video player';
      var wrap = document.createElement('div');
      wrap.className = 'video-hover';
      wrap.innerHTML = placeholder(id, title);
      frame.parentNode.insertBefore(wrap, frame);
      frame.parentNode.removeChild(frame);
      wrap.addEventListener('click', function () {
        if (!wrap.querySelector('iframe')) {
          wrap.innerHTML = player(id, title);
        }
      });
      if (canHover) {
        wrap.addEventListener('mouseenter', function () {
          if (!wrap.querySelector('iframe')) {
            wrap.innerHTML = player(id, title);
          }
        });
        wrap.addEventListener('mouseleave', function () {
          if (wrap.querySelector('iframe')) {
            wrap.innerHTML = placeholder(id, title);
          }
        });
      }
    });
  })();
</script>
